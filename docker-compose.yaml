
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest #SQL Server 2022 container image
    container_name: sabi-sqlserver # Name of the container

    environment:
      ACCEPT_EULA: "Y" # Accept Microsoft's SQL Server license agreement
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD} # Admin password from .env
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433" # Connect Windows port 1433 to container port 1433

    volumes:
      - sabi_sql_data:/var/opt/mssql # Preserve db files when container is created

    restart: unless-stopped

volumes:
  sabi_sql_data:
